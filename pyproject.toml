[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiknowledge"
version = "0.1.0"
description = "Versioned and auditable code context for AI clients"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4",
  "tree-sitter==0.25.2",
  "tree-sitter-c==0.24.2",
]

[project.optional-dependencies]
postgres = [
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.4",
]
semantic = [
  "sentence-transformers==5.6.1",
  "torch==2.13.0",
  "transformers==5.14.1",
]
mcp = [
  "mcp==2.0.0",
]
auth = [
  "PyJWT[crypto]==2.13.0",
]

[project.scripts]
aikb = "aikb.cli:main"
aikb-eval = "aikb.evaluation:main"
aikb-mcp = "aikb.mcp_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
