name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_USER: aikb
          POSTGRES_PASSWORD: aikb
          POSTGRES_DB: aikb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aikb -d aikb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIKB_TEST_POSTGRES_URL: postgresql+psycopg://aikb:aikb@127.0.0.1:5432/aikb
      ZOEKT_IMAGE: ghcr.io/sourcegraph/zoekt:latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install project
        run: python -m pip install -e ".[postgres]"
      - name: Prepare immutable Zoekt fixture
        run: >-
          python -B tests/prepare_zoekt_fixture.py
          --root "$RUNNER_TEMP/aikb-zoekt"
          --env-file "$GITHUB_ENV"
      - name: Index fixture and start Zoekt
        run: |
          docker pull "$ZOEKT_IMAGE"
          docker run --rm \
            -v "$AIKB_TEST_ZOEKT_ROOT:/fixture" \
            "$ZOEKT_IMAGE" \
            zoekt-index \
            -index /fixture/index \
            -meta /fixture/export/zoekt.meta.json \
            -disable_ctags \
            /fixture/export/source
          docker run --rm -d \
            --name aikb-zoekt-ci \
            -p 6070:6070 \
            -v "$AIKB_TEST_ZOEKT_ROOT/index:/data/index:ro" \
            "$ZOEKT_IMAGE" \
            zoekt-webserver -index /data/index -rpc -listen :6070
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6070/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs aikb-zoekt-ci
          exit 1
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Stop Zoekt
        if: always()
        run: docker rm -f aikb-zoekt-ci || true
